[project]
name = "ssync"
version = "0.1.0"
description = "Space Sync UDP transport protocol prototype"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "rich>=14.3.3",
]

[project.scripts]
ssync = "ssync.space_sync.cli:main"
ssyncd = "ssync.space_sync.cli:ssyncd_main"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.0.0",
    "ruff>=0.13.0",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
