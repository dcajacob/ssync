[project]
name = "ssync"
version = "0.1.0"
description = "Space Sync UDP transport protocol prototype"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
ssync = "ssync.space_sync.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
